<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <!-- Anillo orbital dorado trasero -->
  <ellipse cx="62" cy="54" rx="48" ry="18" transform="rotate(-18 62 54)" stroke="#D4AF37" stroke-width="5" fill="none" opacity="0.85" />
  <!-- Cara izquierda de la pirámide verde -->
  <polygon points="60,10 18,75 60,88" fill="#15803D" />
  <!-- Cara derecha iluminada de la pirámide verde -->
  <polygon points="60,10 102,75 60,88" fill="#22C55E" />
  <!-- Franjas horizontales blancas de la pirámide -->
  <line x1="46" y1="32" x2="74" y2="32" stroke="#E6F0FA" stroke-width="2.5" />
  <line x1="36" y1="48" x2="84" y2="48" stroke="#E6F0FA" stroke-width="2.5" />
  <line x1="26" y1="64" x2="94" y2="64" stroke="#E6F0FA" stroke-width="2.5" />
  <!-- Brillo central -->
  <line x1="60" y1="10" x2="60" y2="88" stroke="#86EFAC" stroke-width="1.5" />
  <!-- Arco frontal del anillo dorado -->
  <path d="M 18 68 A 48 18 -18 0 0 106 40" stroke="#EAB308" stroke-width="5.5" fill="none" stroke-linecap="round" />
</svg>
