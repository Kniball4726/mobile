<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5492C6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/ultratech-carreras-logo-dark.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/ultratech-carreras-logo.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/ultratech-carreras-logo.png" />
    <title>UltraTech Carreras — Sistema de Gestión POS</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('justi_theme_v1');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#E6F0FA] text-slate-800 antialiased selection:bg-[#5492C6] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
